services:
  github-project:
    image: localhost/mcp-project-http:latest
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      GITHUB_OWNER: ${GITHUB_OWNER}
      GITHUB_REPO: ${GITHUB_REPO}
      MCP_TOOL_GROUPS: all
      AGENT_RECLAIM_ENABLED: "false"
    ports:
      - "8083:8080"   # 8080 lo usa Quarkus (workshop-auth-backend)

  github-task:
    image: localhost/mcp-task-http:latest
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      GITHUB_OWNER: ${GITHUB_OWNER}
      GITHUB_REPO: ${GITHUB_REPO}
      MCP_TOOL_GROUPS: all
      AGENT_RECLAIM_ENABLED: "false"
    ports:
      - "8081:8080"