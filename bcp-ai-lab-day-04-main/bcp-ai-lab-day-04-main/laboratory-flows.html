<title>Flujos Agénticos — Día 4</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@500;600;700;800&family=DM+Mono:wght@300;400;500&display=swap');

*{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#080d14;--surf:#0f1520;--surf2:#16202e;--bd:#1e2d42;
  --t:#dce8f5;--t2:#6b859e;--t3:#2b3f56;
  --s1:#00cfa8;--s2:#4d8fff;--s3:#b86fff;--s4:#ff7a45;
  --acc:#00cfa8;
}

body{
  background:var(--bg);color:var(--t);
  font-family:'Syne',sans-serif;
  height:100vh;display:flex;flex-direction:column;overflow:hidden;
}

/* ── HEADER ── */
header{
  display:flex;align-items:center;gap:1.5rem;
  padding:.6rem 1.25rem;
  border-bottom:1px solid var(--bd);
  background:var(--surf);flex-shrink:0;
}
.logo{
  font-size:.68rem;font-weight:700;letter-spacing:.12em;
  text-transform:uppercase;color:var(--t3);white-space:nowrap;
}
.tabs{display:flex;gap:.2rem;flex:1}
.tab{
  padding:.38rem .85rem;border-radius:5px;
  border:1px solid transparent;
  font-family:'DM Mono',monospace;font-size:.68rem;
  cursor:pointer;color:var(--t2);background:transparent;
  transition:color .2s,border-color .2s,background .2s;
}
.tab:hover{color:var(--t);border-color:var(--bd)}
.tab.active{color:var(--t);background:var(--surf2);border-color:var(--bd)}
.tdot{
  display:inline-block;width:6px;height:6px;border-radius:50%;
  margin-right:6px;vertical-align:middle;flex-shrink:0;
}

/* ── WORKSPACE ── */
.workspace{flex:1;display:flex;overflow:hidden}

/* ── FLOW PANEL ── */
.flow-panel{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:1.1rem 1.25rem .8rem;
  overflow:hidden;position:relative;
}
.flow-header{
  width:100%;display:flex;justify-content:space-between;
  align-items:baseline;margin-bottom:.6rem;flex-shrink:0;
}
.flow-title{font-size:1rem;font-weight:800;color:var(--acc);transition:color .3s}
.flow-sub{font-family:'DM Mono',monospace;font-size:.62rem;color:var(--t3)}
#flow-svg{width:100%;flex:1;overflow:visible;min-height:0}

/* ── SVG: node ── */
.nbox{fill:var(--surf2);stroke:var(--bd);stroke-width:1.5;transition:fill .3s,stroke .3s,filter .3s}
.nio .nbox{fill:var(--bg);stroke:var(--t3)}
.nckpt .nbox{fill:var(--bg);stroke:var(--t3);stroke-dasharray:4 3}
.nlbl{
  font-family:'Syne',sans-serif;font-size:11.5px;font-weight:700;
  fill:var(--t2);text-anchor:middle;dominant-baseline:auto;
  transition:fill .3s;pointer-events:none;
}
.nsub{
  font-family:'DM Mono',monospace;font-size:9px;
  fill:var(--t3);text-anchor:middle;dominant-baseline:auto;
  transition:fill .3s;pointer-events:none;
}
.fnode[data-s=on] .nbox{
  fill:color-mix(in srgb,var(--acc) 14%,var(--surf2));
  stroke:var(--acc);stroke-width:2;
  filter:drop-shadow(0 0 10px color-mix(in srgb,var(--acc) 50%,transparent));
}
.fnode[data-s=on] .nlbl,.fnode[data-s=ok] .nlbl{fill:var(--t)}
.fnode[data-s=on] .nsub,.fnode[data-s=ok] .nsub{fill:var(--t2)}
.fnode[data-s=ok] .nbox{
  fill:color-mix(in srgb,var(--acc) 8%,var(--surf2));
  stroke:color-mix(in srgb,var(--acc) 55%,var(--bd));
}
@keyframes pulse{0%,100%{opacity:1}55%{opacity:.72}}
.fnode[data-s=on] .nbox{animation:pulse 1.7s ease-in-out infinite}

/* ── SVG: edge ── */
.fedge{stroke:var(--bd);stroke-width:1.5;fill:none;marker-end:url(#arr)}
.fedge.info{stroke:var(--t3);stroke-dasharray:4 4;opacity:.55;stroke-width:1.2;marker-end:url(#arr-info)}
.elbl{font-family:'DM Mono',monospace;font-size:8.5px;fill:var(--t3);text-anchor:middle}

/* ── LOG PANEL ── */
.log-panel{
  width:260px;flex-shrink:0;border-left:1px solid var(--bd);
  display:flex;flex-direction:column;background:var(--surf);
}
.log-hdr{
  padding:.52rem 1rem;border-bottom:1px solid var(--bd);
  font-family:'DM Mono',monospace;font-size:.62rem;color:var(--t3);
  letter-spacing:.05em;flex-shrink:0;
}
.log-body{flex:1;overflow-y:auto;padding:.65rem;display:flex;flex-direction:column;gap:.4rem}
.log-body::-webkit-scrollbar{width:4px}
.log-body::-webkit-scrollbar-track{background:transparent}
.log-body::-webkit-scrollbar-thumb{background:var(--bd);border-radius:2px}
.lentry{
  font-family:'DM Mono',monospace;font-size:.67rem;line-height:1.55;
  color:var(--t2);border-left:2px solid var(--t3);padding-left:.52rem;
  opacity:0;transform:translateY(5px);animation:fadeUp .28s ease forwards;
}
.lentry.cur{border-left-color:var(--acc);color:var(--t)}
@keyframes fadeUp{to{opacity:1;transform:none}}
.lts{color:var(--t3);margin-right:.3rem}
.lbadge{
  display:inline-block;padding:1px 5px;border-radius:3px;
  font-size:.59rem;margin-right:.3rem;font-weight:500;
  background:color-mix(in srgb,var(--acc) 18%,transparent);
  color:var(--acc);
}

/* ── FOOTER ── */
footer{
  display:flex;align-items:center;gap:.65rem;
  padding:.58rem 1.25rem;border-top:1px solid var(--bd);
  background:var(--surf);flex-shrink:0;
}
.btn{
  padding:.38rem 1rem;border-radius:5px;border:none;
  font-family:'DM Mono',monospace;font-size:.7rem;font-weight:500;
  cursor:pointer;transition:opacity .2s,transform .1s;
}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.32;cursor:not-allowed}
.btn-play{background:var(--acc);color:#000}
.btn-rst{background:var(--surf2);color:var(--t2);border:1px solid var(--bd)}
.step-info{
  font-family:'DM Mono',monospace;font-size:.67rem;color:var(--t2);
  flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.sdots{display:flex;gap:4px;align-items:center}
.sdot{
  width:6px;height:6px;border-radius:50%;background:var(--t3);
  transition:all .25s;flex-shrink:0;
}
.sdot.done{background:var(--acc)}
.sdot.cur{background:var(--acc);transform:scale(1.5)}
.spd{
  background:var(--surf2);border:1px solid var(--bd);color:var(--t2);
  border-radius:4px;font-family:'DM Mono',monospace;font-size:.67rem;
  padding:.3rem .45rem;cursor:pointer;
}
</style>

// ── State ─────────────────────────────────────────────────────────────
let cur = null, curStep = -1, running = false, tmr = null;

// ── DOM ───────────────────────────────────────────────────────────────
const SVG     = document.getElementById('flow-svg');
const logBody = document.getElementById('log-body');
const sinfo   = document.getElementById('sinfo');
const sdots   = document.getElementById('sdots');
const bplay   = document.getElementById('bplay');
const brst    = document.getElementById('brst');

// ── Geometry helpers ──────────────────────────────────────────────────
function nodeById(nodes, id) { return nodes.find(n => n.id === id); }

function edgePath(e, nodes) {
  const f = nodeById(nodes, e.f), t = nodeById(nodes, e.t);
  if (!f || !t) return '';

  if (e.type === 'self') {
    // Self-loop arc below the node
    const x = f.x, y = f.y + NH / 2;
    return `M ${x-20},${y} C ${x-58},${y+72} ${x+58},${y+72} ${x+20},${y}`;
  }
  if (e.type === 'back') {
    // Curved loop below nodes
    const x1 = f.x, y1 = f.y + NH / 2;
    const x2 = t.x, y2 = t.y + NH / 2;
    const cy = y1 + 70;
    return `M ${x1},${y1} C ${x1},${cy} ${x2},${cy} ${x2},${y2}`;
  }
  if (e.type === 'down') {
    // Vertical drop
    return `M ${f.x},${f.y + NH/2} L ${t.x},${t.y - NH/2}`;
  }
  // Horizontal: detect direction
  if (t.x >= f.x) {
    return `M ${f.x + NW/2},${f.y} L ${t.x - NW/2},${t.y}`;
  } else {
    return `M ${f.x - NW/2},${f.y} L ${t.x + NW/2},${t.y}`;
  }
}

function edgeLabelPos(e, nodes) {
  const f = nodeById(nodes, e.f), t = nodeById(nodes, e.t);
  if (!f || !t) return {x:0, y:0};
  if (e.type === 'self') {
    return { x: f.x, y: f.y + NH/2 + 86 };
  }
  if (e.type === 'back') {
    return { x: (f.x + t.x) / 2, y: f.y + NH/2 + 85 };
  }
  if (e.type === 'down') {
    return { x: f.x + 18, y: (f.y + NH/2 + t.y - NH/2) / 2 };
  }
  return { x: (f.x + t.x) / 2, y: f.y - 10 };
}

// ── SVG rendering ─────────────────────────────────────────────────────
function renderSession(s) {
  document.documentElement.style.setProperty('--acc', s.color);
  document.getElementById('ftitle').textContent = s.name;
  document.getElementById('fsub').textContent   = s.sub;
  SVG.setAttribute('viewBox', s.vb);

  const defs = `
<defs>
  <marker id="arr" viewBox="0 0 8 6" refX="7.5" refY="3"
          markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L8,3 L0,6z" fill="#1e2d42"/>
  </marker>
  <marker id="arr-info" viewBox="0 0 8 6" refX="7.5" refY="3"
          markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L8,3 L0,6z" fill="#2b3f56"/>
  </marker>
  <marker id="arr-lit" viewBox="0 0 8 6" refX="7.5" refY="3"
          markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L8,3 L0,6z" fill="${s.color}"/>
  </marker>
</defs>`;

  // Edges first (behind nodes)
  let edges = '';
  for (const e of s.edges) {
    const d   = edgePath(e, s.nodes);
    const cls = 'fedge' + (e.info ? ' info' : '');
    const lp  = e.lbl ? edgeLabelPos(e, s.nodes) : null;
    edges += `<g id="fe-${e.id}">
  <path class="${cls}" d="${d}" id="fp-${e.id}"/>
  ${lp ? `<text class="elbl" x="${lp.x}" y="${lp.y}">${esc(e.lbl)}</text>` : ''}
</g>`;
  }

  // Nodes on top
  let nodes = '';
  for (const n of s.nodes) {
    const rx  = n.x - NW/2, ry = n.y - NH/2;
    const cls = 'fnode' + (n.io ? ' nio' : n.ckpt ? ' nckpt' : '');
    nodes += `<g class="${cls}" id="fn-${n.id}" data-s="">
  <rect class="nbox" x="${rx}" y="${ry}" width="${NW}" height="${NH}" rx="${NR}"/>
  <text class="nlbl" x="${n.x}" y="${n.y - 6}">${esc(n.lbl)}</text>
  <text class="nsub" x="${n.x}" y="${n.y + 16}">${esc(n.sub||'')}</text>
</g>`;
  }

  SVG.innerHTML = defs + edges + nodes;

  // Step dots
  sdots.innerHTML = s.steps.map((_,i) => `<div class="sdot" id="sd-${i}"></div>`).join('');
}

// ── Animation ─────────────────────────────────────────────────────────
function activateStep(i) {
  if (!cur || i >= cur.steps.length) {
    running = false;
    bplay.textContent = '✓ Completado';
    bplay.disabled = false;
    sinfo.textContent = `✓ Pipeline completado — ${cur.steps.length} pasos ejecutados`;
    const ld = document.getElementById(`sd-${i-1}`);
    if (ld) { ld.classList.remove('cur'); ld.classList.add('done'); }
    return;
  }

  const st = cur.steps[i];

  // Dots
  if (i > 0) {
    const pd = document.getElementById(`sd-${i-1}`);
    if (pd) { pd.classList.remove('cur'); pd.classList.add('done'); }
  }
  const cd = document.getElementById(`sd-${i}`);
  if (cd) cd.classList.add('cur');

  // Previous step nodes → done
  if (i > 0) {
    cur.steps[i-1].nodes.forEach(id => {
      const el = document.getElementById(`fn-${id}`);
      if (el) el.setAttribute('data-s', 'ok');
    });
  }

  // Animate edges
  st.edges.forEach(eid => {
    const path = document.getElementById(`fp-${eid}`);
    if (!path) return;
    const len = (path.getTotalLength && path.getTotalLength()) || 400;
    path.style.stroke = cur.color;
    path.style.strokeWidth = '2';
    path.style.markerEnd = 'url(#arr-lit)';
    path.style.strokeDasharray = len;
    path.style.strokeDashoffset = len;
    path.style.transition = 'none';
    void path.getBoundingClientRect();
    path.style.transition = 'stroke-dashoffset .5s ease';
    path.style.strokeDashoffset = 0;
  });

  // Activate nodes
  st.nodes.forEach(id => {
    const el = document.getElementById(`fn-${id}`);
    if (el) el.setAttribute('data-s', 'on');
  });

  // Log entry
  addLog(st.badge, st.msg);

  // Info bar
  sinfo.textContent = `Paso ${i+1} / ${cur.steps.length}  ·  ${st.badge}`;

  curStep = i;
  _updateNav();
  tmr = setTimeout(() => activateStep(i + 1), parseInt(document.getElementById('spd').value, 10));
}

function addLog(badge, msg) {
  logBody.querySelectorAll('.lentry.cur').forEach(e => e.classList.remove('cur'));
  const d = new Date();
  const ts = [d.getHours(), d.getMinutes(), d.getSeconds()]
    .map(n => String(n).padStart(2,'0')).join(':');
  const el = document.createElement('div');
  el.className = 'lentry cur';
  el.innerHTML = `<span class="lts">${ts}</span><span class="lbadge">${esc(badge)}</span><br>${esc(msg).replace(/\n/g,'<br>')}`;
  logBody.appendChild(el);
  logBody.scrollTop = logBody.scrollHeight;
}

function doPlay() {
  if (!cur || running) return;
  doReset();
  running = true;
  bplay.textContent = '⏳ Ejecutando…';
  bplay.disabled = true;
  activateStep(0);
}

function _resetVisual() {
  if (!cur) return;
  cur.nodes.forEach(n => {
    const el = document.getElementById(`fn-${n.id}`);
    if (el) el.setAttribute('data-s', '');
  });
  cur.edges.forEach(e => {
    const path = document.getElementById(`fp-${e.id}`);
    if (!path) return;
    path.style.transition = 'none';
    path.style.stroke = '';
    path.style.strokeWidth = '';
    path.style.markerEnd = '';
    path.style.strokeDasharray = '';
    path.style.strokeDashoffset = '';
  });
  sdots.querySelectorAll('.sdot').forEach(d => d.classList.remove('cur','done'));
  logBody.innerHTML = '';
}

function doReset() {
  clearTimeout(tmr);
  running = false;
  curStep = -1;
  if (!cur) return;
  _resetVisual();
  sinfo.textContent = 'Presiona ▶ Ejecutar para iniciar el flujo';
  bplay.textContent = '▶ Ejecutar';
  bplay.disabled = false;
  _updateNav();
}

// ── Manual step navigation ─────────────────────────────────────────────
function _applyStepInstant(i) {
  _resetVisual();
  for (let j = 0; j <= i; j++) {
    const st = cur.steps[j];
    const isCurrent = (j === i);
    const cd = document.getElementById(`sd-${j}`);

    if (isCurrent) {
      if (cd) cd.classList.add('cur');
      st.nodes.forEach(id => {
        const el = document.getElementById(`fn-${id}`);
        if (el) el.setAttribute('data-s', 'on');
      });
    } else {
      if (cd) cd.classList.add('done');
      st.nodes.forEach(id => {
        const el = document.getElementById(`fn-${id}`);
        if (el) el.setAttribute('data-s', 'ok');
      });
    }

    st.edges.forEach(eid => {
      const path = document.getElementById(`fp-${eid}`);
      if (!path) return;
      path.style.stroke = cur.color;
      path.style.strokeWidth = '2';
      path.style.markerEnd = 'url(#arr-lit)';
      path.style.strokeDasharray = '';
      path.style.strokeDashoffset = '';
    });

    addLog(st.badge, st.msg);
  }
  sinfo.textContent = `Paso ${i+1} / ${cur.steps.length}  ·  ${cur.steps[i].badge}`;
  _updateNav();
}

function _updateNav() {
  const bprev = document.getElementById('bprev');
  const bnext  = document.getElementById('bnext');
  if (!cur || curStep < 0) {
    bprev.disabled = true;
    bnext.disabled = true;
    return;
  }
  bprev.disabled = (curStep <= 0);
  bnext.disabled = (curStep >= cur.steps.length - 1);
}

function doNext() {
  if (!cur) return;
  clearTimeout(tmr);
  running = false;
  bplay.textContent = '▶ Ejecutar';
  bplay.disabled = false;
  const next = curStep + 1;
  if (next >= cur.steps.length) return;
  curStep = next;
  _applyStepInstant(curStep);
}

function doPrev() {
  if (!cur || curStep <= 0) return;
  clearTimeout(tmr);
  running = false;
  bplay.textContent = '▶ Ejecutar';
  bplay.disabled = false;
  curStep = curStep - 1;
  _applyStepInstant(curStep);
}

// ── Utils ─────────────────────────────────────────────────────────────
function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;');
}

// ── Tabs ──────────────────────────────────────────────────────────────
const tabsEl = document.getElementById('tabs');
SESS.forEach(s => {
  const btn = document.createElement('button');
  btn.className = 'tab';
  btn.setAttribute('data-id', s.id);
  btn.innerHTML = `<span class="tdot" style="background:${s.color}"></span>${esc(s.name)}`;
  btn.addEventListener('click', () => {
    if (running) { clearTimeout(tmr); running = false; }
    tabsEl.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    cur = s;
    renderSession(s);
    doReset();
  });
  tabsEl.appendChild(btn);
});

// ── Hash-based tab navigation ──────────────────────────────────────────
function activateById(id) {
  const btn = tabsEl.querySelector('[data-id="' + id + '"]');
  if (btn) {
    tabsEl.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    cur = SESS.find(s => s.id === id) || SESS[0];
    renderSession(cur);
    doReset();
  }
}
const _hash = location.hash.replace('#','');
if (_hash && SESS.find(s => s.id === _hash)) {
  activateById(_hash);
}
window.addEventListener('hashchange', () => {
  const h = location.hash.replace('#','');
  if (h && SESS.find(s => s.id === h)) activateById(h);
});
bplay.addEventListener('click', doPlay);
brst.addEventListener('click', doReset);
document.getElementById('bprev').addEventListener('click', doPrev);
document.getElementById('bnext').addEventListener('click', doNext);

// Auto-select first session
tabsEl.querySelector('.tab').click();
</script>
