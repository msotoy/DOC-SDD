name: Validate skills catalog

on:
  pull_request:
    paths:
      - 'domains/**'
  push:
    branches: [main]
    paths:
      - 'domains/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run validation
        run: |
          chmod +x scripts/validate_skill.sh
          ./scripts/validate_skill.sh
